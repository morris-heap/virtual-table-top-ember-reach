name: API CI and AWS deploy

on:
  pull_request:
    paths: ['api/**', 'infra/**', 'data/**', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['api/**', 'infra/**', 'data/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            infra/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm test
        working-directory: api
      - run: npm ci
        working-directory: infra
      - run: npm run typecheck
        working-directory: infra
      # Synth needs no AWS credentials (account and Region are fixed in infra/bin/app.ts).
      - run: npx cdk synth --strict --quiet
        working-directory: infra

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The deploy role only trusts this environment (infra/lib/github-deploy-stack.ts).
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            infra/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: infra
      # OIDC: no stored AWS keys. The role can only assume the CDK bootstrap roles.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::913427211898:role/emberreach-github-deploy
          aws-region: us-east-2
      - run: npx cdk deploy EmberreachData EmberreachApi --require-approval never
        working-directory: infra
