name: App CI and Cloudflare Pages deploy

on:
  pull_request:
    paths: ['app/**', 'data/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'data/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Deploy to Cloudflare Pages (project "emberreach", custom domain emberreach.morris-heap.com; VTTER-60).
      # Needs the repo secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and the variable CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          # Creates the project on the first run; later runs just see it already exists.
          preCommands: npx wrangler pages project create emberreach --production-branch=main || true
          command: pages deploy dist --project-name=emberreach --branch=main --commit-dirty=true
