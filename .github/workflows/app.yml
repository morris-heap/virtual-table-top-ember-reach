name: App CI

on:
  pull_request:
    paths: ['app/**', 'data/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'data/**', '.github/workflows/app.yml']
  workflow_dispatch:

# Deploys are done by Cloudflare Workers Builds, not here (app/wrangler.jsonc, VTTER-60).
permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
